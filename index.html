<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0B503D">
    <meta name="description" content="牌河视觉档案：以十八张麻将牌收藏图像、文字与项目。点击一张牌，展开一段观察。">
    <title>牌河视觉档案 · ShinRyu</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css?v=2f52bad">
    <script src="./app.js?v=2f52bad" type="module"></script>
  </head>
  <body>
    <main id="viewport" aria-label="牌河视觉档案">
      <div id="scene">
        <div id="board" aria-label="麻将桌上的视觉档案" aria-busy="true">
          <canvas id="table" width="1920" height="1080" aria-hidden="true"></canvas>
          <canvas id="mahjong" width="1116" height="1040" aria-hidden="true"></canvas>
          <header class="console" aria-label="麻将桌控制盒">
            <button id="reset" class="mechanical reset" type="button" aria-label="黄色灯重置：从左上角波纹翻回蓝背" disabled>
              <span class="button-top" aria-hidden="true"></span>
            </button>
            <button id="dealer" class="mechanical dealer" type="button" aria-label="起家（暂未启用）" disabled></button>
            <button id="streak" class="mechanical streak" type="button" aria-label="连庄（暂未启用）" disabled></button>
            <button id="blue-light" class="mechanical blue-light" type="button" aria-label="蓝色灯（暂未启用）" disabled></button>
            <h1 class="sr-only">牌河视觉档案</h1>
          </header>
          <button id="score-stick" class="stick-hit" type="button" aria-label="白色千点棒：点击拿起并掉落" aria-busy="false" data-motion="idle" disabled></button>
          <div id="tiles" role="group" aria-label="十八张牌，六列三行。点击任意一张揭示全部内容。"></div>
        </div>
      </div>
    </main>
    <p id="status" class="sr-only" role="status" aria-live="polite">正在准备牌河。</p>
    <p id="stick-status" class="sr-only" role="status" aria-live="polite"></p>
    <noscript><div class="no-script">牌河视觉档案需要 JavaScript 展示翻牌交互。请启用 JavaScript 后刷新页面。<a href="https://github.com/5h1nRyu/ShinRyu">查看项目</a></div></noscript>
  </body>
</html>
