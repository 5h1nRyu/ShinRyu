<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0B503D">
    <meta name="description" content="牌河视觉档案：点击任意蓝背麻将，以它为中心波纹翻开三处牌河。">
    <title>牌河视觉档案 · ShinRyu</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0b503d; }
      #scene { visibility: hidden; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #0b503d; color: #f4f0e6; font: 16px sans-serif; z-index: 100; }
      #loading[hidden] { display: none; }
    </style>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
    <link id="page-style" rel="stylesheet" href="./styles.css?v=20261011-side-reset" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="./styles.css?v=20261011-side-reset"></noscript>
    <script src="./app.js?v=20261011-side-reset" type="module"></script>
  </head>
  <body>
    <div id="loading" role="status" aria-live="polite"><span id="loading-text">loading</span></div>
    <main id="viewport" aria-label="牌河视觉档案">
      <div id="scene" inert>
        <div id="board" aria-label="麻将桌上的视觉档案" aria-busy="true">
          <canvas id="table" width="1920" height="1080" aria-hidden="true"></canvas>
          <canvas id="mahjong" width="2240" height="1040" aria-hidden="true"></canvas>
          <header class="console" aria-label="麻将桌控制盒">
            <button id="reset" class="mechanical reset" type="button" data-action="start" aria-label="黄色灯开始：从所有牌中左上方的一张开始波纹展开" disabled>
              <span class="button-top" aria-hidden="true"></span>
            </button>
            <a id="dealer" class="mechanical dealer" href="https://github.com/5h1nRyu" target="_blank" rel="noopener noreferrer" aria-label="github（新标签页打开）"></a>
            <a id="streak" class="mechanical streak" href="https://space.bilibili.com/3546925661948276" target="_blank" rel="noopener noreferrer" aria-label="bilibili（新标签页打开）"></a>
            <button id="blue-light" class="mechanical blue-light" type="button" aria-label="探索" aria-disabled="true"></button>
            <h1 class="sr-only">牌河视觉档案</h1>
          </header>
          <button id="score-stick" class="stick-hit" type="button" aria-label="白色千点棒：点击拿起并掉落" aria-busy="false" data-motion="idle" disabled></button>
          <div id="tiles" role="group" aria-label="下方、上家和下家三处牌河，共五十四张牌。点击任意蓝背牌，波纹翻开全部牌。"></div>
        </div>
      </div>
    </main>
    <p id="status" class="sr-only" role="status" aria-live="polite">正在准备牌河。</p>
    <p id="stick-status" class="sr-only" role="status" aria-live="polite"></p>
    <noscript><style>#loading { display: none; }</style><div class="no-script">牌河视觉档案需要 JavaScript 展示翻牌交互。请启用 JavaScript 后刷新页面。<a href="https://github.com/5h1nRyu/ShinRyu">查看项目</a></div></noscript>
  </body>
</html>
